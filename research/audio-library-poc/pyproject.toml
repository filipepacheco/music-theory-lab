[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-library-poc"
version = "0.1.0"
description = "Reproducible offline harness for the Music Theory Lab audio library POC"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  # Not inference-only: chord_root_key_stage, chord_evaluation and
  # key_evaluation import these at module level, and stage_dispatch pulls
  # chord_root_key_stage in, so `import audio_library_poc.cli` fails without
  # them. They carry no CUDA payload.
  "numpy>=2.0,<3",
  "mir_eval>=0.8,<0.9",
  # scripts/sum_stems.py has a committed test but is not an inference
  # runtime; it reads and writes stem WAVs directly.
  "soundfile>=0.12,<0.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
# Local-only upload-and-analyze service (audio_library_poc.intake_server).
# Development convenience, never a deployed surface: it binds loopback, has
# no authentication, and runs inference for whoever reaches it. Install with:
#   uv sync --extra dev --extra inference --extra server --python $installedPython
server = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "python-multipart>=0.0.18,<1",
]
# Phase 2 real inference. Install with:
#   uv sync --extra dev --extra inference --python $installedPython
# The [tool.uv] blocks below pin torch and torchaudio to the CUDA 12.4
# wheel index; adjust or remove them for a CPU-only or CUDA 11.8 install.
inference = [
  "torch>=2.5,<3",
  "torchaudio>=2.5,<3",
  "bs-roformer-infer==0.1.5",
  "demucs==4.1.0",
  "beat-this==1.1.0",
  # librosa carries the section.librosa_segment runtime as well: it exposes
  # ``librosa.segment.agglomerative`` and the chroma_cqt features that
  # ``_section_runtime.py`` uses. No separate MSAF dep — its scikit-learn
  # constraint (<0.22) does not resolve on modern Python 3.12.
  "librosa>=0.10.1,<0.11",
]

[project.scripts]
audio-library-poc = "audio_library_poc.cli:main"
# Separate binary on purpose: the CLI above stays offline, and this one
# listens on a socket. Needs the `server` extra.
audio-library-intake = "audio_library_poc.intake_server:main"

[tool.uv]
# The POC targets one Windows machine (RTX 2060). Resolving for macOS and
# Linux drags in Demucs's macOS-x86_64 torch<2.3 constraint, which conflicts
# with the CUDA 12.4 wheels this project uses on Windows. Widen this list
# only when the POC has to build on another platform.
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
  # Vendored third-party code kept verbatim from upstream. See each vendor
  # directory's README for provenance and refresh instructions.
  "src/audio_library_poc/vendor",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parsing through call expressions in argument
# defaults (`file: UploadFile = File(...)`). That is the framework's only
# way to say it, and these calls build descriptors rather than the mutable
# shared state B008 exists to catch.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Query",
]

[tool.ruff.format]
quote-style = "double"
