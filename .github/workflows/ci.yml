name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall copies sql-wasm.wasm into public/, which the build needs.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # `npm run build` is `tsc && vite build`, so this is the type-check too.
      - name: Type-check and build
        run: npm run build

  poc:
    name: Audio library POC (ruff + pytest)
    # Windows, not Linux: uv.lock resolves only for `sys_platform == 'win32'`
    # (see [tool.uv].environments in pyproject.toml), and the separator smoke
    # test looks for the CLI at .venv\Scripts\audio-library-poc.exe.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: research/audio-library-poc
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: research/audio-library-poc/uv.lock

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
